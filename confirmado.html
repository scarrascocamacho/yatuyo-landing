<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Suscripción confirmada | YaTuyo</title>
  <meta name="description" content="Tu suscripción a la lista de espera de YaTuyo ha sido confirmada.">

  <style>
    :root {
      --green: #0F6B3A;
      --lime: #A2D729;
      --background: #F8FAF6;
      --text: #1F2937;
      --muted: #667085;
      --border: #E4E9E1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(90%, 820px);
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .brand {
      display: inline-block;
      color: var(--green);
      font-size: 26px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 60px 0;
    }

    .confirmation {
      max-width: 650px;
      margin: 0 auto;
      padding: 54px 45px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 22px;
      text-align: center;
    }

    .check {
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--lime);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 16px;
      color: var(--green);
      font-size: 38px;
      line-height: 1.15;
    }

    p {
      margin: 0 auto;
      max-width: 500px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 25px;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover {
      opacity: 0.92;
    }

    footer {
      padding: 25px 0 35px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        padding: 35px 0;
      }

      .confirmation {
        padding: 40px 22px;
      }

      h1 {
        font-size: 32px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <a class="brand" href="/">YaTuyo</a>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="confirmation">

        <div class="check">✓</div>

        <h1>¡Ya estás dentro!</h1>

        <p>
          Tu email ha quedado confirmado.
          Te avisaremos cuando YaTuyo esté disponible para probarlo.
        </p>

        <a class="button" href="/">
          Volver a YaTuyo
        </a>

      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      © 2026 YaTuyo
    </div>
  </footer>

</body>
</html>
